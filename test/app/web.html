<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4B1020">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<title>Stepney Shah Jalal Mosque</title>
<link rel="icon" href="assets/images/icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="assets/images/icons/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<!-- A website page inside the app, without the website's header and footer: web.html#zakat, #events, #services, #about
     (the list is webPages in config.js) -->
<body data-page="web" class="page-frame">
<div class="app">
  <!-- this screen's own content: moving between screens swaps only this (nav.js, with HTMX); the tabs and side menu stay -->
  <div id="view">
  <div class="view" data-page="web" data-frame="web" data-scripts="frame.js">
    <header class="top top-sm">
      <div class="pattern" aria-hidden="true"></div>
      <div class="top-bar">
        <button class="icon-btn" type="button" data-menu-open aria-controls="drawer" aria-expanded="false" aria-label="Open menu"><svg class="ico"><use href="#i-menu"/></svg></button>
        <div class="page-title"><h1 id="webTitle">&nbsp;</h1><p id="webSub">&nbsp;</p></div>
        <button class="icon-btn" type="button" data-share aria-label="Share this app"><svg class="ico"><use href="#i-share"/></svg></button>
      </div>
    </header>

    <main class="frame-wrap" id="main">
      <div class="frame-msg" id="frameLoading" role="status"><span class="spinner" aria-hidden="true"></span><p>Loading…</p></div>
      <div class="frame-msg" id="frameOffline" hidden>
        <svg class="ico frame-ico"><use href="#i-wifi"/></svg>
        <h2>You're offline</h2>
        <p>This page needs an internet connection. Please connect and try again.</p>
        <button class="btn-main" type="button" id="frameRetry">Try again</button>
      </div>
      <iframe class="frame" id="frame" allow="clipboard-write" referrerpolicy="strict-origin-when-cross-origin" hidden></iframe>
    </main>
  </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/data/builtin-data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/alerts.js"></script>
<script src="assets/js/vendor/htmx.min.js"></script>
<script src="assets/js/nav.js"></script>
</body>
</html>
