<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4B1020">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<title>99 Names of Allah | Hefazothe Islam UK</title>
<link rel="icon" href="assets/images/icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="assets/images/icons/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<!-- 99 Names of Allah (side menu) -->
<body data-page="names">
<div class="app">
  <!-- this screen's own content: moving between screens swaps only this (nav.js, with HTMX); the tabs and side menu stay -->
  <div id="view">
  <div class="view" data-page="names" data-scripts="names.js">
    <!-- the header stays at the top while scrolling through the names -->
    <div class="sticky-head">
      <header class="top top-sm">
        <div class="pattern" aria-hidden="true"></div>
        <div class="top-bar">
          <button class="icon-btn" type="button" data-menu-open aria-controls="drawer" aria-expanded="false" aria-label="Open menu"><svg class="ico"><use href="#i-menu"/></svg></button>
          <div class="page-title"><h1>99 Names of Allah</h1><p>Al-Asma ul-Husna</p></div>
          <button class="icon-btn" type="button" data-share aria-label="Share this app"><svg class="ico"><use href="#i-share"/></svg></button>
        </div>
      </header>
    </div>

    <main class="main n-main" id="main">
      <label class="n-find">
        <svg class="ico" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="nFind" type="search" placeholder="Search a name, meaning or number" autocomplete="off" aria-label="Search the names">
        <span class="n-count tnum" id="nCount" aria-live="polite"></span>
      </label>

      <section class="n-allah" id="nAllah" aria-label="Allah"></section>

      <ol class="n-list" id="nList" aria-label="The 99 Names"></ol>
      <p class="n-none" id="nNone" hidden>No names match your search.</p>
    </main>
  </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/data/builtin-data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/alerts.js"></script>
<script src="assets/js/vendor/htmx.min.js"></script>
<script src="assets/js/nav.js"></script>
</body>
</html>
