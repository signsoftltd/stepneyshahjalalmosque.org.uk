<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4B1020">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<title>Prayer timetable | Hefazothe Islam UK</title>
<link rel="icon" href="assets/images/icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="assets/images/icons/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<!-- The whole year's prayer times, month by month (Time tab) -->
<body data-page="time">
<div class="app">
  <!-- this screen's own content: moving between screens swaps only this (nav.js, with HTMX); the tabs and side menu stay -->
  <div id="view">
  <div class="view" data-page="time" data-scripts="time.js makrooh.js pull.js">
    <!-- the header and month picker stay at the top while scrolling through the year -->
    <div class="sticky-head" id="timeHead">
      <header class="top top-sm">
        <div class="pattern" aria-hidden="true"></div>
        <div class="top-bar">
          <button class="icon-btn" type="button" data-menu-open aria-controls="drawer" aria-expanded="false" aria-label="Open menu"><svg class="ico"><use href="#i-menu"/></svg></button>
          <div class="page-title"><h1>Prayer timetable</h1><p id="yearSub">&nbsp;</p></div>
          <button class="icon-btn" type="button" data-share aria-label="Share this app"><svg class="ico"><use href="#i-share"/></svg></button>
        </div>
      </header>

      <!-- month picker -->
      <nav class="months" id="months" aria-label="Months"></nav>
    </div>

    <main class="year" id="year" aria-live="polite">
      <p class="year-empty">Loading the timetable…</p>
    </main>

    <button class="today-fab" type="button" id="toToday" hidden><svg class="ico"><use href="#i-cal"/></svg>Today</button>
  </div>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/data/builtin-data.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/alerts.js"></script>
<script src="assets/js/vendor/htmx.min.js"></script>
<script src="assets/js/nav.js"></script>
</body>
</html>
